name: Manual-Repository-Migration-Workflow

on:
  workflow_dispatch:
    inputs:
      GH_SOURCE_PAT:
        description: 'GitHub Source Personal Access Token'
        required: true
      GH_PAT:
        description: 'GitHub Target Personal Access Token'
        required: true
      GH_SOURCE_ORG:
        description: 'GitHub Source Organization'
        required: true
      GH_TARGET_ORG:
        description: 'GitHub Target Organization'
        required: true
      GH_SOURCE_REPO:
        description: 'GitHub Source Repository'
        required: true
      ADD_TEAM:
        description: 'Do you want to add a team?'
        required: true
        default: false
        type: boolean
      TEAM_NAME:
        description: 'GitHub Team Name (only required if adding a team)'
        required: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      gei-path: ${{ steps.set-output.outputs.gei-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download GEI CLI
        run: |
          curl -L -o gei https://github.com/github/gh-gei/releases/latest/download/gei-linux-amd64
          chmod +x gei
          mkdir -p tools
          mv gei tools/gei
        id: download-gei

      - name: Set GEI path output
        id: set-output
        run: echo "gei-path=tools/gei" >> $GITHUB_OUTPUT

  Migrate:
    runs-on: ubuntu-latest
    needs: prep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Migrate repository
        shell: pwsh
        env:
          GH_PAT: ${{ github.event.inputs.GH_PAT }}
          GH_SOURCE_PAT: ${{ github.event.inputs.GH_SOURCE_PAT }}
        run: |
          function Exec {
            param ([scriptblock]$ScriptBlock)
            & $ScriptBlock
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          function ExecAndGetMigrationID {
            param ([scriptblock]$ScriptBlock)
            $Output = & $ScriptBlock
            Write-Host $Output
            $MigrationID = $Output | Select-String -Pattern "\(ID: (.+?)\)" | ForEach-Object { $_.Matches[0].Groups[1].Value }
            return $MigrationID
          }

          $GH_PAT = "${{ github.event.inputs.GH_PAT }}"
          $GH_SOURCE_PAT = "${{ github.event.inputs.GH_SOURCE_PAT }}"
          $GH_SOURCE_ORG = "${{ github.event.inputs.GH_SOURCE_ORG }}"
          $GH_TARGET_ORG = "${{ github.event.inputs.GH_TARGET_ORG }}"
          $GH_SOURCE_REPO = "${{ github.event.inputs.GH_SOURCE_REPO }}"

          Write-Host "::group::Migrating $GH_SOURCE_ORG/$GH_SOURCE_REPO"
          $MigrationID = ExecAndGetMigrationID {
            ./gei migrate-repo `
              --github-source-org "$GH_SOURCE_ORG" `
              --source-repo "$GH_SOURCE_REPO" `
              --github-target-org "$GH_TARGET_ORG" `
              --github-source-pat "$GH_SOURCE_PAT" `
              --github-target-pat "$GH_PAT" `
              --queue-only `
              --lock-source-repo `
              --verbose
          }

          if ($MigrationID) {
            Write-Host "Queued migration with ID $MigrationID"
            Write-Host "::endgroup::"
            Write-Host "Waiting for migration ID $MigrationID to complete..."
            ./gei wait-for-migration --migration-id $MigrationID
            Write-Host "Migration completed."
          } else {
            Write-Error "Failed to queue migration."
            exit 1
          }
  
  add_teams:
    runs-on: ubuntu-latest
    needs: Migrate
    if: ${{ github.event.inputs.ADD_TEAM == 'true' }}
    steps:
      - name: Fail if TEAM_NAME is not provided
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.TEAM_NAME }}" ]; then
            echo "Error: TEAM_NAME must be provided when ADD_TEAM is true."
            exit 1
          fi

      - name: Add team to repo
        shell: pwsh
        env:
          GH_PAT: ${{ github.event.inputs.GH_PAT }}
          GH_TARGET_ORG: ${{ github.event.inputs.GH_TARGET_ORG }}
          GH_SOURCE_REPO: ${{ github.event.inputs.GH_SOURCE_REPO }}
          TEAM_NAME: ${{ github.event.inputs.TEAM_NAME }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_PAT"
            Accept = "application/vnd.github+json"
          }

          $url = "https://api.github.com/orgs/$env:GH_TARGET_ORG/teams/$env:TEAM_NAME/repos/$env:GH_TARGET_ORG/$env:GH_SOURCE_REPO"
          $body = '{"permission": "admin"}'

          Invoke-RestMethod -Method PUT -Uri $url -Headers $headers -Body $body -ContentType "application/json"

